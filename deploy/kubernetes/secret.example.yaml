# EXAMPLE ONLY — do not commit a real token.
#
# Prefer creating the secret out of band:
#
#   kubectl -n vllm-colocate create secret generic huggingface \
#     --from-literal=HF_TOKEN="$HF_TOKEN"
#
# or wiring it up through your secret manager (External Secrets, Vault agent,
# sealed-secrets, ...). The StatefulSet references this key as optional, so
# public models work with no secret at all.
apiVersion: v1
kind: Secret
metadata:
  name: huggingface
  labels:
    app.kubernetes.io/name: vllm-colocate
type: Opaque
stringData:
  HF_TOKEN: "hf_replace_me"
